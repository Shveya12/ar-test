<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AR Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
h1 {
  font-size: 20px;
  margin-bottom: 20px;
}
model-viewer {
  width: 100%;
  max-width: 400px;
  height: 350px;
  border-radius: 12px;
  background: #fff;
}
</style>
</head>
<body>
<h1>AR Test – Sofa</h1>

<model-viewer
  src="model.glb"
  alt="3D модель дивана"
  ar
  ar-modes="scene-viewer webxr"
  camera-controls
  autoplay
  shadow-intensity="1">
</model-viewer>

<p>Відкрий цю сторінку на Android у Chrome та натисни кнопку AR.</p>
</body>
</html>
