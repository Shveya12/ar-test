<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <title>AR Test – Sofa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Підключаємо model-viewer з CDN -->
  <script type="module"
          src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
      text-align: center;
    }
    p {
      margin: 12px 0 0;
      text-align: center;
      line-height: 1.4;
    }
    .viewer-wrap {
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    model-viewer {
      width: 100%;
      height: 360px;
      display: block;
    }
    .ar-btn {
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body>
  <h1>AR Test – Sofa</h1>
  <p>версия 1.1</p>

  <div class="viewer-wrap">
    <model-viewer
      src="model.glb"
      alt="3D модель дивана"
      ar
      ar-modes="scene-viewer webxr"
      ar-scale="fixed"
      camera-controls
      autoplay
      shadow-intensity="1"
      exposure="1.1">
    </model-viewer>
  </div>

  <p>Відкрий цю сторінку на Android у Chrome. Якщо не зʼявилася кнопка AR у вʼюері –
     спробуй кнопку нижче.</p>

  <!-- Запасний варіант: прямий запуск Scene Viewer -->
  <a class="ar-btn"
     href="https://arvr.google.com/scene-viewer/1.0?file=https%3A%2F%2Fshveya12.github.io%2Far-test%2Fmodel.glb&mode=ar_preferred"
     rel="ar">
    Відкрити диван в AR
  </a>
</body>
</html>
